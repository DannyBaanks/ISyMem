name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sin ziggrep en CI: cubre el camino de respaldo en Python de las anclas.
      - run: python3 -m py_compile agent_memory.py && python3 test_agent_memory.py
